name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Unzip the project
        run: for f in *.zip; do unzip -o "$f"; done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the APK
        working-directory: TambolaNumberAnnouncer
        run: gradle assembleDebug --no-daemon

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: Tambola-APK
          path: TambolaNumberAnnouncer/app/build/outputs/apk/debug/app-debug.apk
